name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-go@v7
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: |
            backend/go.sum
            proto/go.sum

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: ui/package-lock.json

      - uses: bufbuild/buf-action@v1.1.3
        with:
          setup_only: true
          version: 1.72.0

      - name: Install UI dependencies
        working-directory: ui
        run: npm ci

      - name: Verify generated protobuf
        working-directory: proto
        run: |
          rm -rf gen
          buf lint
          buf build -o ../backend/internal/mcp/proto_image.binpb
          buf generate
          git diff --exit-code

      - name: Test Go
        run: CGO_ENABLED=0 go test ./backend/...

      - name: Vet Go
        run: CGO_ENABLED=0 go vet ./backend/...

      - name: Race-test Go
        run: CGO_ENABLED=1 go test -race -short ./backend/...

      - name: Check and test UI
        working-directory: ui
        run: |
          npm run check
          npm test
          npm run build
